[project]
name = "invoice-extractor"
version = "0.1.0"
description = "CLI tool to extract structured data from invoices using the Gemini API"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
